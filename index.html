<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PWA Stealth de Gestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CONFIGURACIÓN PWA PARA PANTALLA COMPLETA/STANDALONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="https://github.com/jorbau/H/blob/965b6a9a69af24bd623ab5efcd87596aaa7bd729/stealth_manifest.json">
    <style>
        /* Estilos base: Pantalla completamente negra y táctil */
        body, html {
            height: 100%;
            overflow: hidden;
            touch-action: none; 
            font-family: sans-serif;
            background-color: #000000;
        }
        #app-container {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Alinea el contenido en la parte inferior */
            padding-bottom: 20px;
        }

        /* Estilo para el mensaje de retroalimentación sutil */
        #feedback-message {
            /* Fuente pequeña y sutil en la parte inferior */
            font-size: 0.75rem; /* text-xs de Tailwind */
            text-align: center;
            opacity: 0; /* Inicialmente invisible */
            transition: opacity 0.3s ease, color 0.3s ease;
            min-height: 1.5rem; /* Previene CLS */
        }

        /* Colores de estado */
        .status-success {
            color: #10B981; /* Verde esmeralda (Green 500) */
        }
        .status-error {
            color: #EF4444; /* Rojo (Red 500) */
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Único elemento visible: el mensaje de retroalimentación sutil -->
        <p id="feedback-message" class="text-xs"></p>
    </div>

    <script>
        // --- CONFIGURACIÓN DE LA PWA SECRETA ---
        const API_URL = 'http://192.168.4.1';
        const MAX_RETRIES = 5;
        const SWIPE_THRESHOLD = 30; 
        const API_TIMEOUT_MS = 5000; 

        // 1. Mapeo de Conversión de VALOR (2 Swipes)
        const SWIPE_TO_VALUE = {
            "uu": { name: "REINA", code: "R€1N@_D€_" },
            "ur": { name: "AS", code: "@$_D€_" },
            "ru": { name: "DOS", code: "D0$_D€_" },
            "rr": { name: "TRES", code: "7R€$_" },
            "rd": { name: "CUATRO", code: "CU@7R0_" },
            "dr": { name: "CINCO", code: "C1NC0_" },
            "dd": { name: "SEIS", code: "$€1$_D€_" },
            "dl": { name: "SIETE", code: "$1€7€_" },
            "ld": { name: "OCHO", code: "0CH0_" },
            "ll": { name: "NUEVE", code: "NU€V€_" },
            "lu": { name: "DIEZ", code: "D1€2_D€_" },
            "ul": { name: "JOTA", code: "J07@_D€_" },
            "ud": { name: "REY", code: "R€1_D€_" }
        };

        // 2. Mapeo de Conversión de PALO (1 Swipe)
        const SWIPE_TO_SUIT = {
            "u": { name: "PICAS", code: "P1C@$" },
            "r": { name: "CORAZONES", code: "C0R@20N€$" },
            "d": { name: "TRÉBOLES", code: "7R€801€$" },
            "l": { name: "DIAMANTES", code: "D1@M@N7€" }
        };

        let swipeSequence = [];
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartY = 0;
        let touchendY = 0;

        const feedbackMessage = document.getElementById('feedback-message');

        /**
         * Muestra o borra el mensaje de retroalimentación en la parte inferior.
         * @param {string} message Mensaje a mostrar. Si es nulo o vacío, el mensaje se oculta.
         * @param {string} status 'success' para verde, 'error' para rojo, 'loading' para gris.
         */
        function setFeedback(message, status = 'loading') {
            if (!message) {
                // Borrar mensaje (4to swipe exitoso)
                feedbackMessage.textContent = '';
                feedbackMessage.style.opacity = 0;
                feedbackMessage.className = '';
                return;
            }

            // Aplicar contenido y visibilidad
            feedbackMessage.textContent = message;
            feedbackMessage.style.opacity = 1;

            // Aplicar color de estado
            if (status === 'success') {
                feedbackMessage.className = 'status-success';
            } else if (status === 'error') {
                feedbackMessage.className = 'status-error';
            } else {
                // Estado 'loading' o intermedio (gris sutil)
                feedbackMessage.className = 'text-gray-400';
            }
        }


        /**
         * Devuelve el objeto de la carta completa (nombre y código) si la secuencia es válida.
         */
        function getCardData() {
            if (swipeSequence.length !== 3) return null;

            const currentSequence = swipeSequence.join('');
            const valueCode = currentSequence.slice(0, 2);
            const suitCode = currentSequence.slice(2, 3);
            
            const valueData = SWIPE_TO_VALUE[valueCode];
            const suitData = SWIPE_TO_SUIT[suitCode];

            if (valueData && suitData) {
                return {
                    name: `${valueData.name} de ${suitData.name}`,
                    code: `.${valueData.code}${suitData.code}`
                };
            }
            return null;
        }


        /**
         * Realiza una llamada a la API con backoff exponencial, reintentos y TIMEOUT forzado.
         */
        async function callApiWithBackoff(endpoint, isStopCall, cardName = '', retryCount = 0) {
            const fullUrl = `${API_URL}${endpoint}`;
            const delay = Math.pow(2, retryCount) * 1000 + (Math.random() * 500);

            // 1. Mostrar estado de carga (gris)
            if (!isStopCall) {
                setFeedback(`${cardName} - ENVIANDO...`, 'loading');
            } else if (isStopCall && retryCount === 0) {
                 setFeedback(`PARADA - ENVIANDO...`, 'loading');
            }


            try {
                if (retryCount > 0) {
                    // Espera exponencial en reintento
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS); 

                const response = await fetch(fullUrl, { 
                    method: 'GET', 
                    mode: 'no-cors',
                    signal: controller.signal 
                });
                
                clearTimeout(timeoutId); 

                // --- LÓGICA DE RESPUESTA ---
                if (response.status === 200 || response.status === 0 || response.status === undefined) {
                    // Status 200, 0 o undefined = ÉXITO (o petición enviada con 'no-cors')
                    if (isStopCall) {
                        setFeedback(null); // Desaparecer el texto (Requisito 4)
                    } else {
                        setFeedback(`${cardName} - ENVIADO`, 'success'); // Verde (Requisito 3)
                    }
                } 
                // Códigos de error específicos
                else if (!isStopCall && response.status === 409) {
                    setFeedback(`${cardName} - ERROR (409: Ya hay carta)`, 'error'); // Rojo (Requisito 3)
                } else if (!isStopCall && response.status === 422) {
                    setFeedback(`${cardName} - ERROR (422: Código inválido)`, 'error'); // Rojo (Requisito 3)
                }
                // Otro código de error
                else {
                    const message = isStopCall 
                        ? `PARADA - ERROR (${response.status} inesperado)` 
                        : `${cardName} - ERROR (${response.status} inesperado)`;
                    setFeedback(message, 'error'); // Rojo (Requisito 3)
                }

            } catch (error) {
                // Este bloque captura errores de red Y el timeout
                if (retryCount < MAX_RETRIES) {
                    await callApiWithBackoff(endpoint, isStopCall, cardName, retryCount + 1);
                } else {
                    const message = error.name === 'AbortError' 
                        ? (isStopCall ? 'PARADA - FALLO: TIMEOUT' : `${cardName} - FALLO: TIMEOUT`)
                        : (isStopCall ? 'PARADA - FALLO CRÍTICO DE RED' : `${cardName} - FALLO CRÍTICO DE RED`);
                    setFeedback(message, 'error'); // Rojo (Requisito 3)
                }
            }
        }

        /**
         * Determina la dirección del swipe (u, d, l, r) en minúsculas para el protocolo.
         */
        function getSwipeDirection(x1, x2, y1, y2) {
            const xDiff = x2 - x1;
            const yDiff = y2 - y1;

            if (Math.abs(xDiff) < SWIPE_THRESHOLD && Math.abs(yDiff) < SWIPE_THRESHOLD) {
                return null;
            }

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                return xDiff > 0 ? 'r' : 'l'; // derecha o izquierda
            } else {
                return yDiff > 0 ? 'd' : 'u'; // abajo o arriba
            }
        }

        /**
         * Maneja un nuevo gesto de swipe detectado.
         */
        function handleSwipe(direction) {
            if (swipeSequence.length < 4) {
                swipeSequence.push(direction);
            }
            
            // Lógica de 3 swipes (Enviar Código)
            if (swipeSequence.length === 3) {
                const cardData = getCardData();

                if (cardData) {
                    // Envolver en comillas dobles y Codificar URL
                    const encodedWord = encodeURIComponent(`"${cardData.code}"`); 
                    const endpoint = `/send?word=${encodedWord}`;
                    
                    // Mostrar retroalimentación "ENVIANDO..."
                    setFeedback(`${cardData.name} - ENVIANDO...`, 'loading');

                    // Llamar a la API
                    callApiWithBackoff(endpoint, false, cardData.name);
                    
                } else {
                    // Secuencia de 3 gestos no válida
                    setFeedback(`CÓDIGO NO VÁLIDO: ${swipeSequence.join('')}`, 'error');
                }
            } 
            
            // Lógica de 4to swipe (Detener Transmisión)
            else if (swipeSequence.length === 4) {
                const endpoint = '/stopSending';
                
                // Mostrar retroalimentación "DETENIENDO..."
                setFeedback(`PARADA - ENVIANDO...`, 'loading');
                
                // Llamar a la API
                callApiWithBackoff(endpoint, true); 
                
                // Reiniciar secuencia inmediatamente para el siguiente gesto
                swipeSequence = [];
            } 
        }

        // --- MANEJO DE EVENTOS TÁCTILES y de RATÓN ---
        // (La lógica es idéntica a la versión anterior, solo cambiamos a 'stealth')
        function touchStart(event) {
            event.preventDefault(); 
            touchstartX = event.changedTouches[0].clientX;
            touchstartY = event.changedTouches[0].clientY;
        }

        function touchEnd(event) {
            touchendX = event.changedTouches[0].clientX;
            touchendY = event.changedTouches[0].clientY;
            const direction = getSwipeDirection(touchstartX, touchendX, touchstartY, touchendY);
            if (direction) {
                handleSwipe(direction);
            }
        }

        let isMouseDown = false;
        let mouseStartX = 0;
        let mouseStartY = 0;

        function mouseDown(event) {
            event.preventDefault(); 
            isMouseDown = true;
            mouseStartX = event.clientX;
            mouseStartY = event.clientY;
        }

        function mouseUp(event) {
            if (!isMouseDown) return;
            isMouseDown = false;
            
            const mouseEndX = event.clientX;
            const mouseEndY = event.clientY;

            const direction = getSwipeDirection(mouseStartX, mouseEndX, mouseStartY, mouseEndY);
            if (direction) {
                handleSwipe(direction);
            }
        }

        // Inicialización
        window.onload = function() {
            const container = document.getElementById('app-container');

            // Eventos táctiles
            container.addEventListener('touchstart', touchStart, { passive: false });
            container.addEventListener('touchend', touchEnd, false);
            container.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false }); 

            // Eventos de ratón
            container.addEventListener('mousedown', mouseDown, false);
            container.addEventListener('mouseup', mouseUp, false);
            document.body.addEventListener('mouseup', mouseUp, false);

            console.log("PWA de gestos en Modo Stealth inicializada.");
        };

    </script>
</body>
</html>
