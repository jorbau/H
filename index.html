<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PWA Visible para Debug</title>
    <!-- Incluye el Manifest para PWA y Service Worker para que sea instalable -->
    <link rel="manifest" href="stealth_manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
        
        /* Tema totalmente negro */
        body, html {
            height: 100%;
            overflow: hidden;
            touch-action: none; 
            font-family: 'Space Grotesk', sans-serif;
            background-color: #000000;
        }
        #app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #E5E7EB;
            padding: 20px;
        }

        /* Ahora estos elementos no son invisibles, pero los dejamos vacíos. */
        .invisible-element-legacy {
            display: none; 
        }
        
        #word-to-send {
            display: none; 
        }
    </style>
</head>
<body>
    <div id="app-container">
        
        <!-- Retroalimentación Visual de la Carta (Invisible, solo para mantener la estructura HTML) -->
        <div class="text-center mb-8 invisible-element-legacy">
            <h2 id="card-rank" class="text-3xl md:text-5xl font-extrabold"></h2>
            <p id="card-suit" class="text-xl md:text-3xl font-light"></p>
        </div>

        <!-- Muestra el CÓDIGO o el ESTADO API EN GRANDE Y CENTRADO -->
        <div id="status-display" class="text-center">
            
            <p id="main-status" class="text-5xl md:text-7xl font-extrabold tracking-tight"></p>
            
            <!-- Indicadores de secuencia que no usamos en este modo de debug, los ocultamos -->
            <div class="mt-4 pt-3 invisible-element-legacy">
                <span class="text-sm mr-2">Swipe:</span>
                <span id="swipe-dot-1"></span>
                <span id="swipe-dot-2"></span>
                <span id="swipe-dot-3"></span>
            </div>
        </div>
        
        <!-- El elemento discreto ya no se usa y se elimina del HTML -->
    </div>

    <script>
        // --- CONFIGURACIÓN DE LA PWA ---
        const API_URL = 'http://192.168.4.1';
        const MAX_RETRIES = 5;
        const SWIPE_THRESHOLD = 30; 
        const API_TIMEOUT_MS = 5000; // Tiempo de espera máximo de 5 segundos

        // 1. Mapeo de Conversión de VALOR (2 Swipes)
        const SWIPE_TO_VALUE = {
            "uu": { name: "REINA", short: "Q", code: "R€1N@_D€_" },
            "ur": { name: "AS", short: "A", code: "@$_D€_" },
            "ru": { name: "DOS", short: "2", code: "D0$_D€_" },
            "rr": { name: "TRES", short: "3", code: "7R€$_" },
            "rd": { name: "CUATRO", short: "4", code: "CU@7R0_" },
            "dr": { name: "CINCO", short: "5", code: "C1NC0_" },
            "dd": { name: "SEIS", short: "6", code: "$€1$_D€_" },
            "dl": { name: "SIETE", short: "7", code: "$1€7€_" },
            "ld": { name: "OCHO", short: "8", code: "0CH0_" },
            "ll": { name: "NUEVE", short: "9", code: "NU€V€_" },
            "lu": { name: "DIEZ", short: "10", code: "D1€2_D€_" },
            "ul": { name: "JOTA", short: "J", code: "J07@_D€_" },
            "ud": { name: "REY", short: "K", code: "R€1_D€_" }
        };

        // 2. Mapeo de Conversión de PALO (1 Swipe)
        const SWIPE_TO_SUIT = {
            "u": { name: "PICAS", symbol: "♠", code: "P1C@$" },
            "r": { name: "CORAZONES", symbol: "♥", code: "C0R@20N€$" },
            "d": { name: "TRÉBOLES", symbol: "♣", code: "7R€801€$" },
            "l": { name: "DIAMANTES", symbol: "♦", code: "D1@M@N7€" }
        };

        let swipeSequence = [];
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartY = 0;
        let touchendY = 0;
        let lastSentCard = ""; 

        // Referencias a elementos
        const mainStatus = document.getElementById('main-status');

        /**
         * Actualiza el estado central en pantalla (grande y persistente).
         */
        function updateMainStatus(message, color = 'text-red-500') {
            mainStatus.textContent = message;
            // Clases Tailwind para tamaño (7xl) y color.
            mainStatus.className = `text-5xl md:text-7xl font-extrabold tracking-tight ${color}`;
        }

        /**
         * Muestra un mensaje temporal en la consola (solo para depuración).
         */
        function displayStatus(message, color = 'text-white', duration = 3000) {
            console.log(`STATUS: ${message}`);
        }

        /**
         * Realiza una llamada a la API con backoff exponencial, reintentos y timeout forzado.
         */
        async function callApiWithBackoff(endpoint, retryCount = 0) {
            const fullUrl = `${API_URL}${endpoint}`;
            const delay = Math.pow(2, retryCount) * 1000 + (Math.random() * 500);
            const isStopCall = endpoint.includes('stop');
            
            // Determinar los mensajes según el requisito del usuario
            const successMsg = isStopCall ? 'FREE' : lastSentCard; 
            const errorMsg = 'ERROR';
            const successColor = 'text-green-500';
            const errorColor = 'text-red-500';

            // Mensaje de Carga (visible en cada reintento)
            updateMainStatus('...', 'text-gray-500'); 

            try {
                if (retryCount > 0) {
                    displayStatus(`REINTENTO (${retryCount})`, 'text-yellow-400', 5000);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
                
                // Usamos AbortController para forzar un timeout en el fetch
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);

                // Intentamos la llamada
                const response = await fetch(fullUrl, { 
                    method: 'GET', 
                    mode: 'no-cors',
                    signal: controller.signal // Aplicamos la señal de timeout
                });
                
                clearTimeout(timeoutId); // Limpiamos el timeout si la llamada es rápida
                
                // Caso de éxito legible (200) o éxito opaco (0, por no-cors)
                if (response.status === 200 || response.status === 0 || response.status === undefined) {
                    displayStatus(`API OK: ${successMsg}`);
                    updateMainStatus(successMsg, successColor);

                } else if (!isStopCall && (response.status === 409 || response.status === 422)) {
                    // Errores del servidor 
                    displayStatus(`ERROR SERVER (${response.status})`);
                    updateMainStatus(errorMsg, errorColor);
                } else {
                    // Otro error de servidor (500, etc.)
                    displayStatus(`ERROR INESPERADO (${response.status})`);
                    updateMainStatus(errorMsg, errorColor);
                }

            } catch (error) {
                // Este bloque captura errores de red Y el timeout del AbortController
                
                if (error.name === 'AbortError') {
                    console.error("Error: Solicitud de API abortada por timeout (5s).");
                } else {
                    console.error(`Error de red/fetch (${fullUrl}):`, error.message);
                }
                
                if (retryCount < MAX_RETRIES) {
                    console.warn(`Reintentando en ${delay / 1000}s...`);
                    await callApiWithBackoff(endpoint, retryCount + 1);
                } else {
                    displayStatus('FALLO CRÍTICO DE RED.');
                    updateMainStatus(errorMsg, errorColor);
                }
            }
        }

        /**
         * Determina la dirección del swipe (u, d, l, r) en minúsculas para el protocolo.
         */
        function getSwipeDirection(x1, x2, y1, y2) {
            const xDiff = x2 - x1;
            const yDiff = y2 - y1;

            if (Math.abs(xDiff) < SWIPE_THRESHOLD && Math.abs(yDiff) < SWIPE_THRESHOLD) {
                return null;
            }

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                return xDiff > 0 ? 'r' : 'l'; // derecha o izquierda
            } else {
                return yDiff > 0 ? 'd' : 'u'; // abajo o arriba
            }
        }

        /**
         * Maneja un nuevo gesto de swipe detectado.
         */
        function handleSwipe(direction) {
            // Limpiar el estado al inicio de una nueva secuencia
            updateMainStatus('', 'text-white'); 

            if (swipeSequence.length < 4) {
                swipeSequence.push(direction);
            }
            
            // Lógica de 3 swipes (Enviar Código)
            if (swipeSequence.length === 3) {
                const valueCode = swipeSequence.slice(0, 2).join('');
                const suitCode = swipeSequence[2];
                
                const valueData = SWIPE_TO_VALUE[valueCode];
                const suitData = SWIPE_TO_SUIT[suitCode];

                if (valueData && suitData) {
                    const word = `.${valueData.code}${suitData.code}`;
                    // Formato corto de carta (ej: A♠) para el feedback.
                    lastSentCard = `${valueData.short}${suitData.symbol}`; 
                    
                    const encodedWord = encodeURIComponent(`"${word}"`); 
                    const endpoint = `/send?word=${encodedWord}`;
                    
                    displayStatus(`CARTA: ${lastSentCard}. Enviando...`);
                    
                    callApiWithBackoff(endpoint);
                    
                } else {
                    displayStatus(`CÓDIGO NO VÁLIDO: Reiniciando...`);
                    updateMainStatus('ERROR', 'text-red-500');
                }

                // Reiniciar secuencia
                swipeSequence = [];
            } 
            
            // Lógica de 4to swipe (Detener Transmisión)
            else if (swipeSequence.length === 4) {
                const endpoint = '/stopSending';
                displayStatus(`4TO SWIPE DETECTADO: PARADA. Enviando FREE...`);
                
                callApiWithBackoff(endpoint);
                
                // Reiniciar secuencia
                swipeSequence = [];
            } 
        }

        // --- MANEJO DE EVENTOS TÁCTILES y de RATÓN ---
        function touchStart(event) {
            event.preventDefault(); 
            touchstartX = event.changedTouches[0].clientX;
            touchstartY = event.changedTouches[0].clientY;
        }

        function touchEnd(event) {
            touchendX = event.changedTouches[0].clientX;
            touchendY = event.changedTouches[0].clientY;
            const direction = getSwipeDirection(touchstartX, touchendX, touchstartY, touchendY);
            if (direction) {
                handleSwipe(direction);
            }
        }

        let isMouseDown = false;
        let mouseStartX = 0;
        let mouseStartY = 0;

        function mouseDown(event) {
            event.preventDefault(); 
            isMouseDown = true;
            mouseStartX = event.clientX;
            mouseStartY = event.clientY;
        }

        function mouseUp(event) {
            if (!isMouseDown) return;
            isMouseDown = false;
            
            const mouseEndX = event.clientX;
            const mouseEndY = event.clientY;

            const direction = getSwipeDirection(mouseStartX, mouseEndX, mouseStartY, mouseEndY);
            if (direction) {
                handleSwipe(direction);
            }
        }

        // Inicialización
        window.onload = function() {
            const container = document.getElementById('app-container');

            // --- REGISTRO DEL SERVICE WORKER (PWA) ---
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Fallo en el registro del Service Worker:', err));
            }

            // Eventos táctiles
            container.addEventListener('touchstart', touchStart, { passive: false });
            container.addEventListener('touchend', touchEnd, false);
            container.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false }); 

            // Eventos de ratón
            container.addEventListener('mousedown', mouseDown, false);
            container.addEventListener('mouseup', mouseUp, false);
            document.body.addEventListener('mouseup', mouseUp, false);

            updateMainStatus('LISTO', 'text-gray-700');
            console.log("PWA inicializada en modo DEBUG (feedback visible).");
        };

    </script>
</body>
</html>
